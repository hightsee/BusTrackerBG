<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Outer circle -->
  <circle cx="100" cy="80" r="60" stroke="#185FA5" stroke-width="8"/>

  <!-- Bus body -->
  <rect x="50" y="60" width="100" height="80" rx="20" fill="#185FA5"/>

  <!-- Window -->
  <rect x="70" y="75" width="60" height="40" rx="8" fill="white"/>

  <!-- Top bar -->
  <rect x="80" y="65" width="40" height="8" rx="4" fill="white"/>

  <!-- Side details -->
  <rect x="45" y="85" width="10" height="30" rx="5" fill="#185FA5"/>
  <rect x="145" y="85" width="10" height="30" rx="5" fill="#185FA5"/>

  <!-- Lights -->
  <circle cx="75" cy="125" r="6" fill="white"/>
  <circle cx="125" cy="125" r="6" fill="white"/>

  <!-- Bottom line -->
  <rect x="75" y="140" width="50" height="4" fill="white"/>

  <!-- Pin tip -->
  <polygon points="100,180 80,150 120,150" fill="#185FA5"/>
</svg>
